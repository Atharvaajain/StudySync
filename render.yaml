# Render Blueprint — the StudySync backend (REST API + Socket.IO + deadline sweeper).
# The web app is served by Vercel, which rewrites /api and /socket.io here, so the browser still
# sees ONE origin (DEVELOPMENT_ROADMAP 5.6). Database: Neon (DATABASE_URL).
# Not yet verified on Render: see docs/DEPLOYMENT.md before using it.
services:
  - type: web
    name: studysync
    runtime: node
    # One instance only: presence, rate limits and the sweeper's lease are per process (§22).
    numInstances: 1
    # Dev dependencies hold the Prisma CLI (migrations, client generation) and esbuild.
    buildCommand: npm ci --include=dev && npm run build -w @studysync/server
    # Applies committed migrations only (never resets). Needs a plan with pre-deploy commands;
    # otherwise prefix the start command with `npm run db:deploy -w @studysync/server && `.
    preDeployCommand: npm run db:deploy -w @studysync/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      # Vercel's rewrite proxy + Render's load balancer. Use 1 if you serve the web app from
      # Render instead (STATIC_DIR=apps/web/dist, build with `npm run build`).
      - key: TRUST_PROXY
        value: '2'
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # paste the Neon connection string (see docs/DEPLOYMENT.md)
      - key: JWT_ACCESS_SECRET
        generateValue: true
